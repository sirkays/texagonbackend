services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt (HTTP-01)
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      # HTTP -> HTTPS redirect (catch-all)
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks: [web]

  # Serves /static/* and /media/* directly
  assets:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assets.rule=Host(`texagonbackend.esm.name.ng`) && (PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.assets.entrypoints=websecure"
      - "traefik.http.routers.assets.tls.certresolver=le"
      - "traefik.http.services.assets.loadbalancer.server.port=80"
    networks: [web]

  django:
    build: .
    container_name: djangoapp
    restart: unless-stopped
    env_file: .env
    # Ensure volumes are writeable by app user, then run app as 'django'
    user: "0:0"
    command: >
      sh -lc '
        mkdir -p /app/staticfiles /app/media &&
        chown -R 10001:10001 /app/staticfiles /app/media &&
        su -s /bin/sh -c "
          python manage.py migrate --noinput &&
          python manage.py collectstatic --noinput &&
          gunicorn texagonbackend.wsgi:application
        " django
      '
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    labels:
      - "traefik.enable=true"
      # App routes (everything else)
      - "traefik.http.routers.django.rule=Host(`texagonbackend.esm.name.ng`)"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.tls.certresolver=le"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks: [web]

volumes:
  static_volume:
  media_volume:

networks:
  web:
    external: false
