{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Techxagon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #FAF8F6;
    }

    .grad {
      background: linear-gradient(135deg, #DC3005 0%, #F97316 100%);
    }

    .card {
      background: #fff;
      border: 1px solid #EDE8E3;
      border-radius: 20px;
    }

    .field {
      width: 100%;
      padding: .85rem 1rem;
      border: 1.5px solid #EDE8E3;
      border-radius: 12px;
      outline: none;
      font-size: .95rem;
      background: #fff;
    }

    .field:focus {
      border-color: #F97316;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <img src="{% static 'assets/logo_text.png' %}" alt="Techxagon" style="height:80px; margin:0 auto 1rem;" />
      <h1 class="text-2xl font-extrabold text-[#1A1410]">Authorized User Login</h1>
      <p class="text-sm text-[#9A8F86] mt-2">Sign in to access the applications dashboard.</p>
    </div>

    <div class="card p-6 md:p-8">
      <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {% for error in form.non_field_errors %}
          <div>{{ error }}</div>
          {% endfor %}
        </div>
        {% endif %}

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-2 text-[#6B7280]">Email</label>
          {{ form.username }}
        </div>

        <div class="mb-5">
          <label class="block text-sm font-semibold mb-2 text-[#6B7280]">Password</label>
          <div class="relative">
            {{ form.password }}
            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#9A8F86] hover:text-[#1A1410] transition-colors focus:outline-none">
              <svg id="eyeOpen" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" class="hidden" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full grad text-white font-bold rounded-xl py-3 shadow-lg shadow-orange-500/20 hover:opacity-90 transition-opacity">
          Login
        </button>
      </form>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.querySelector('input[name="password"]');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', !isPassword);
        eyeClosed.classList.toggle('hidden', isPassword);
      });
    }
  </script>
</body>

</html>
