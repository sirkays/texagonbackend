<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f5;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- HEADER -->
          <tr>
            <td style="background:linear-gradient(135deg,#E53E1A 0%,#F47C20 100%);padding:36px 40px;text-align:center;">
              {% if logo_url %}
                <img src="{{ logo_url }}" alt="Techxagon Academy" height="52"
                     style="display:block;margin:0 auto;height:52px;width:auto;" />
              {% else %}
                <h1 style="margin:0;font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">
                  TECHXAGON <span style="font-weight:300;">ACADEMY</span>
                </h1>
              {% endif %}
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding:36px 40px 28px;">
              <p style="margin:0 0 20px;font-size:15px;color:#444444;line-height:1.7;">
                Hi <strong style="color:#1a1a1a;">{{ name }}</strong>,
              </p>

              <!-- Admin's custom message rendered here -->
              <div style="font-size:15px;color:#444444;line-height:1.8;">
                {{ custom_body }}
              </div>
            </td>
          </tr>

          <!-- DIVIDER -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #eeeeee;margin:0;" />
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="padding:24px 40px 32px;text-align:center;">
              <p style="margin:0 0 6px;font-size:12px;color:#aaaaaa;">
                © {{ year }} Techxagon Academy. All rights reserved.
              </p>
              <p style="margin:0;font-size:12px;color:#cccccc;">
                You're receiving this as part of your tutor application process.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
