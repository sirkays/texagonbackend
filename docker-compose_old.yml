services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ACME (Let's Encrypt) via HTTP-01 on port 80
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      # Global HTTP -> HTTPS (low priority so ACME wins)
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.priority=1"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https@docker"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

      # (optional) security + gzip middlewares
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.compress.compress=true"
    networks: [web]

  # Serves /static/* and /media/* directly
  assets:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Match host + the static/media prefixes
      - "traefik.http.routers.assets.rule=Host(`texagonbackend.epichouse.online`) && (PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.assets.entrypoints=websecure"
      - "traefik.http.routers.assets.priority=10"
      - "traefik.http.routers.assets.tls=true"
      - "traefik.http.routers.assets.tls.certresolver=le"
      - "traefik.http.routers.assets.middlewares=secure-headers@docker,compress@docker"
      - "traefik.http.services.assets.loadbalancer.server.port=80"
    networks: [web]

  django:
    build: .
    container_name: djangoapp
    restart: unless-stopped
    env_file: .env
    # If you *do* have a non-root 'django' user in the image, keep this block.
    # Otherwise replace the command with your usual start (gunicorn / uvicorn).
    user: "0:0"
    command: >
      sh -lc '
        mkdir -p /app/staticfiles /app/media &&
        chown -R 10001:10001 /app/staticfiles /app/media ||
        true &&
        gunicorn texagonbackend.wsgi:application -b 0.0.0.0:8000
      '
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Everything else goes to Django
      - "traefik.http.routers.django.rule=Host(`texagonbackend.epichouse.online`)"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.priority=5"
      - "traefik.http.routers.django.tls=true"
      - "traefik.http.routers.django.tls.certresolver=le"
      - "traefik.http.routers.django.middlewares=secure-headers@docker,compress@docker"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
    networks: [web]

volumes:
  static_volume:
  media_volume:

networks:
  web:
    name: web
    external: false
